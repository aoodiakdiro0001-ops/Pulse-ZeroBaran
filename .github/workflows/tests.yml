# ============================================================
# Pulse-ZeroBaran · Tests on every push/PR (free CI)
# ============================================================
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q core collectors db delivery config scripts dashboard tests

      - name: Run test suite
        run: python tests/test_pulse.py
