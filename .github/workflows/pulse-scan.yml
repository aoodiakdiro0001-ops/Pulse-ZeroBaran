# ============================================================
# Pulse-ZeroBaran · Scheduled Reputation Scan (GitHub Actions)
# يمسح المصادر كل 6 ساعات: جمع → تحليل → تخزين → تنبيه
# ============================================================
name: pulse-scan

on:
  schedule:
    - cron: "17 */6 * * *"      # كل 6 ساعات (بتوقيت UTC)
  workflow_dispatch:             # تشغيل يدوي من لوحة GitHub

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PULSE_RSS_FEEDS: ${{ vars.PULSE_RSS_FEEDS }}
          PULSE_WEB_PAGES: ${{ vars.PULSE_WEB_PAGES }}
        run: python scripts/scan_pulse.py

      - name: Upload pulse snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pulse-latest
          path: output/pulse_latest.json
          retention-days: 30

      # يحفظ نسخة يومية في repo (سجل السمعة التاريخي)
      - name: Commit daily snapshot
        run: |
          git config user.name "pulse-bot"
          git config user.email "baranavisat@gmail.com"
          mkdir -p history
          cp output/pulse_latest.json "history/pulse-$(date -u +%F).json" || true
          git add history || true
          git diff --cached --quiet || git commit -m "pulse: daily snapshot $(date -u +%F)"
          git push || true
